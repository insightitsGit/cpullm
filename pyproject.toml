[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-llm"
version = "1.7.1"
description = "A deterministic, CPU-native epistemic reasoning appliance. Answers from stored paragraphs, with no GPU decoder."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Amin Parva", email = "parvaamin@gmail.com" }]
license = "Apache-2.0"
keywords = [
  "cpu",
  "epistemic",
  "retrieval",
  "pgvector",
  "vectorprism",
]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2",
  "pyarrow>=15",
  "vectorprism[encoder,postgres]==0.1.3",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2",
  "chorusgraph==1.3.0",
  "prismguard==0.1.10",
  "prismcognition==2.1.0",
  "prismrag-patch==0.2.1",
  "prismresonance==0.3.0",
  "prismcortex==0.4.1",
  "prismmanifest==0.3.4",
  "prismshine==0.2.2",
  "prismthinker==1.2.0",
  "prismagenticpay==1.4.1",
  "pypdf>=5",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/insightitsGit/cpullm"
Repository = "https://github.com/insightitsGit/cpullm"

[project.scripts]
cpu-llm-ingest = "cpu_llm.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpu_llm = ["data/*.md", "data/*.json", "data/wikitext-2-raw-v1/*", "checkpoints/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
