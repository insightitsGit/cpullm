name: Prepare or publish Python release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new matching version tag through PyPI OIDC
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require matching release tag for publication
        env:
          SHOULD_PUBLISH: ${{ inputs.publish }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          if os.environ['SHOULD_PUBLISH'] == 'true':
              assert os.environ['GITHUB_REF'] == f'refs/tags/v{version}', 'Publish only a matching version tag'
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VECTORPRISM_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      CPU_LLM_LIVE_TESTS: '1'
      HF_HOME: ${{ runner.temp }}/encoder-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-distributions
          path: dist/
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "$(printf '%s' dist/*.whl)[prompt_nlp]" pytest
      - run: python -m pip check
      - run: python -m spacy download en_core_web_sm
      - run: python -c "import os, psycopg; c = psycopg.connect(os.environ['VECTORPRISM_PG_DSN'], autocommit=True); c.execute('CREATE EXTENSION vector'); c.close()"
      - run: python tools/prepare_encoder_cache.py --cache-root "$HF_HOME"
      - run: python -m pytest -o pythonpath= --tb=short -ra
        env:
          HF_HUB_OFFLINE: '1'
  fastcoreference:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-distributions
          path: dist/
      - run: python -m pip install --upgrade pip
      - shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python -m pip install "$wheel[fastcoreference]"
      - run: python -m pip check
      - run: python -m spacy download en_core_web_sm
      - run: python -c "from cpu_llm.references import FastCorefBackend; r = FastCorefBackend().analyze('Alice built the machine.', 'What did she build?'); assert 'Alice' in str(r), r"
  publish:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, fastcoreference]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
